[project]
name = "hiddify-bot"
version = "1.0.0"
description = "Telegram bot for managing a Hiddify VPN panel"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "ruff==0.11.13",
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
    "pre-commit==4.2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long — ruff format handles it
]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "filters", "formatters", "handlers", "keyboards", "middlewares", "services", "utils"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
